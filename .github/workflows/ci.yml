name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── Backend: type-check, unit tests, e2e, build ───────────────────────────
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Type-check
        working-directory: backend
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: backend
        run: npm test -- --coverage
        env:
          JWT_SECRET: ci-access-secret-not-used-in-production
          JWT_REFRESH_SECRET: ci-refresh-secret-not-used-in-production

      - name: E2e tests
        working-directory: backend
        run: npm run test:e2e
        env:
          JWT_SECRET: ci-access-secret-not-used-in-production
          JWT_REFRESH_SECRET: ci-refresh-secret-not-used-in-production

      - name: Build
        working-directory: backend
        run: npm run build

  # ── Frontend: type-check and production build ─────────────────────────────
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check & build
        working-directory: frontend
        run: npm run build

  # ── Deploy to EC2 (only on push to main/master after CI passes) ───────────
  deploy:
    name: Deploy to EC2
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: MONGODB_URI,JWT_SECRET,JWT_REFRESH_SECRET,FRONTEND_URL
          script: |
            set -e
            cd ${{ secrets.EC2_APP_PATH }}

            # Write/refresh the .env file from CI secrets
            cat > .env <<EOF
            MONGODB_URI=$MONGODB_URI
            JWT_SECRET=$JWT_SECRET
            JWT_REFRESH_SECRET=$JWT_REFRESH_SECRET
            FRONTEND_URL=$FRONTEND_URL
            EOF

            echo "==> Pulling latest code"
            git pull origin master

            echo "==> Rebuilding and restarting containers"
            docker compose up -d --build --remove-orphans

            echo "==> Removing dangling images"
            docker image prune -f

            echo "==> Waiting for backend health check"
            for i in $(seq 1 15); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health || true)
              if [ "$STATUS" = "200" ]; then
                echo "Backend healthy after ${i}s"
                break
              fi
              echo "  waiting... (${i}s)"
              sleep 2
            done

            if [ "$STATUS" != "200" ]; then
              echo "Health check failed — rolling back"
              docker compose down
              git stash
              git checkout @{-1}
              docker compose up -d
              exit 1
            fi

            echo "==> Deploy complete"
