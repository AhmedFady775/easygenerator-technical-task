name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend — lint, unit tests, e2e tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Type-check
        working-directory: backend
        run: npx tsc --noEmit

      - name: Unit tests with coverage
        working-directory: backend
        run: npm test -- --coverage
        env:
          JWT_SECRET: ci-access-secret-not-used-in-production
          JWT_REFRESH_SECRET: ci-refresh-secret-not-used-in-production

      - name: E2e tests
        working-directory: backend
        run: npm run test:e2e
        env:
          JWT_SECRET: ci-access-secret-not-used-in-production
          JWT_REFRESH_SECRET: ci-refresh-secret-not-used-in-production

      - name: Build
        working-directory: backend
        run: npm run build

  frontend:
    name: Frontend — type-check, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check & build
        working-directory: frontend
        run: npm run build
